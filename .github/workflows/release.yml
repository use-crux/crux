name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish a nightly npm release from main.
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changesets:
    name: Changesets
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-embed-assets:
    name: Build Embed Assets
    needs: changesets
    if: github.event_name == 'push' && needs.changesets.outputs.hasChangesets == 'false'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and embed devtools assets
        run: make -C packages/local build-devtools embed

      - name: Upload embed assets
        uses: actions/upload-artifact@v7
        with:
          name: embed-assets
          path: |
            packages/local/internal/assets/embed/**
            packages/local/internal/assets/ui-embed/**
          if-no-files-found: error

  build-local-binary:
    name: Build ${{ matrix.target }}
    needs: [changesets, build-embed-assets]
    if: github.event_name == 'push' && needs.changesets.outputs.hasChangesets == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-unknown-linux-gnu
            apt_packages: ''
          - target: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu
          - target: darwin-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            apt_packages: ''
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            apt_packages: ''
          - target: win32-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-pc-windows-gnu
            apt_packages: gcc-mingw-w64-x86-64
          - target: win32-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-pc-windows-gnullvm
            apt_packages: xz-utils
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download embed assets
        uses: actions/download-artifact@v7
        with:
          name: embed-assets
          path: packages/local/internal/assets

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/local/go.mod
          cache-dependency-path: packages/local/go.sum

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup target add ${{ matrix.rust_target }}
          rustc --version

      - name: Install cross-compilation packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install llvm-mingw for Windows arm64
        if: matrix.target == 'win32-arm64'
        env:
          LLVM_MINGW_VERSION: '20260616'
        run: |
          mkdir -p .tmp/toolchains
          curl -fsSL \
            -o .tmp/toolchains/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar -xJf .tmp/toolchains/llvm-mingw.tar.xz -C .tmp/toolchains
          root="$PWD/.tmp/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Configure Windows arm64 linker
        if: matrix.target == 'win32-arm64'
        run: |
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=$LLVM_MINGW_ROOT/bin/aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR=$LLVM_MINGW_ROOT/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build local binary bundle
        run: make -C packages/local ${{ matrix.target }}

      - name: Upload local binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: local-${{ matrix.target }}
          path: packages/local/dist/crux-${{ matrix.target }}/bin/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish
    needs: [changesets, build-local-binary]
    if: github.event_name == 'push' && needs.changesets.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download local binary bundles
        uses: actions/download-artifact@v7
        with:
          pattern: local-*
          path: .tmp/local-artifacts

      - name: Restore local binary bundles
        run: |
          mkdir -p packages/local/dist
          for artifact in .tmp/local-artifacts/local-*; do
            target="${artifact##*/local-}"
            mkdir -p "packages/local/dist/crux-${target}/bin"
            cp -R "${artifact}/." "packages/local/dist/crux-${target}/bin/"
          done

      - name: Configure git tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage and validate npm packages
        run: pnpm release:stage && pnpm release:validate

      - name: Publish staged npm packages
        run: pnpm release:publish-staged -- --git-tag --git-push-tags

      - name: Prepare GitHub release notes
        id: release-notes
        run: pnpm release:notes -- --out .tmp/github-release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-notes.outputs.tag }}
          RELEASE_TITLE: Crux ${{ steps.release-notes.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release-notes.outputs.notes_file }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --target "$GITHUB_SHA"
          fi

  nightly:
    name: Nightly
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-latest
    outputs:
      shouldPublish: ${{ steps.should-publish.outputs.should_publish }}
      version: ${{ steps.should-publish.outputs.release_version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Create nightly version
        id: version
        run: node ./scripts/create-nightly-version.mjs

      - name: Decide whether to publish
        id: should-publish
        env:
          NIGHTLY_SHA: ${{ steps.version.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CREATED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          should_publish=true
          latest_nightly=''
          complete_nightly=false
          release_version="$CREATED_VERSION"

          if [ "$EVENT_NAME" = "schedule" ]; then
            latest_nightly="$(npm view @use-crux/core@nightly version --json 2>/dev/null | tr -d '"' || true)"
            if [[ "$latest_nightly" == *"sha${NIGHTLY_SHA}"* ]]; then
              complete_nightly=true
              nightly_packages=(
                @use-crux/core
                @use-crux/ai
                @use-crux/anthropic
                @use-crux/convex
                @use-crux/google
                @use-crux/indexer
                @use-crux/ingest
                @use-crux/openai
                @use-crux/otel
                @use-crux/postgres
                @use-crux/react
                @use-crux/upstash
                @use-crux/local
                @use-crux/local-linux-x64
                @use-crux/local-linux-arm64
                @use-crux/local-darwin-x64
                @use-crux/local-darwin-arm64
                @use-crux/local-win32-x64
                @use-crux/local-win32-arm64
              )

              for package in "${nightly_packages[@]}"; do
                published_version="$(npm view "${package}@nightly" version --json 2>/dev/null | tr -d '"' || true)"
                if [ "$published_version" != "$latest_nightly" ]; then
                  complete_nightly=false
                  break
                fi
              done

              if [ "$complete_nightly" = "true" ]; then
                should_publish=false
                release_version="$latest_nightly"
              fi
            fi
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "latest_nightly=$latest_nightly" >> "$GITHUB_OUTPUT"
          {
            echo "Nightly version: $CREATED_VERSION"
            echo "Latest published nightly: ${latest_nightly:-none}"
            echo "Complete published nightly: $complete_nightly"
            echo "Should publish: $should_publish"
          } >> "$GITHUB_STEP_SUMMARY"

  nightly-build-embed-assets:
    name: Nightly Build Embed Assets
    needs: nightly
    if: needs.nightly.outputs.shouldPublish == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and embed devtools assets
        run: make -C packages/local build-devtools embed

      - name: Upload embed assets
        uses: actions/upload-artifact@v7
        with:
          name: nightly-embed-assets
          path: |
            packages/local/internal/assets/embed/**
            packages/local/internal/assets/ui-embed/**
          if-no-files-found: error

  nightly-build-local-binary:
    name: Nightly Build ${{ matrix.target }}
    needs: [nightly, nightly-build-embed-assets]
    if: needs.nightly.outputs.shouldPublish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-unknown-linux-gnu
            apt_packages: ''
          - target: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu
          - target: darwin-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            apt_packages: ''
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            apt_packages: ''
          - target: win32-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-pc-windows-gnu
            apt_packages: gcc-mingw-w64-x86-64
          - target: win32-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-pc-windows-gnullvm
            apt_packages: xz-utils
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download embed assets
        uses: actions/download-artifact@v7
        with:
          name: nightly-embed-assets
          path: packages/local/internal/assets

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/local/go.mod
          cache-dependency-path: packages/local/go.sum

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup target add ${{ matrix.rust_target }}
          rustc --version

      - name: Install cross-compilation packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install llvm-mingw for Windows arm64
        if: matrix.target == 'win32-arm64'
        env:
          LLVM_MINGW_VERSION: '20260616'
        run: |
          mkdir -p .tmp/toolchains
          curl -fsSL \
            -o .tmp/toolchains/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar -xJf .tmp/toolchains/llvm-mingw.tar.xz -C .tmp/toolchains
          root="$PWD/.tmp/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Configure Windows arm64 linker
        if: matrix.target == 'win32-arm64'
        run: |
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=$LLVM_MINGW_ROOT/bin/aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR=$LLVM_MINGW_ROOT/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build local binary bundle
        run: make -C packages/local ${{ matrix.target }}

      - name: Upload local binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: nightly-local-${{ matrix.target }}
          path: packages/local/dist/crux-${{ matrix.target }}/bin/*
          if-no-files-found: error
          compression-level: 0

  nightly-publish:
    name: Nightly Publish
    needs: [nightly, nightly-build-local-binary]
    if: needs.nightly.outputs.shouldPublish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download local binary bundles
        uses: actions/download-artifact@v7
        with:
          pattern: nightly-local-*
          path: .tmp/local-artifacts

      - name: Restore local binary bundles
        run: |
          mkdir -p packages/local/dist
          for artifact in .tmp/local-artifacts/nightly-local-*; do
            target="${artifact##*/nightly-local-}"
            mkdir -p "packages/local/dist/crux-${target}/bin"
            cp -R "${artifact}/." "packages/local/dist/crux-${target}/bin/"
          done

      - name: Stage and validate nightly npm packages
        env:
          NIGHTLY_VERSION: ${{ needs.nightly.outputs.version }}
        run: pnpm release:stage -- --version "$NIGHTLY_VERSION" && pnpm release:validate

      - name: Publish nightly npm packages
        run: pnpm release:publish-staged -- --npm-tag nightly

      - name: Summary
        run: echo "Published @use-crux packages at ${{ needs.nightly.outputs.version }} with npm tag nightly." >> "$GITHUB_STEP_SUMMARY"

  nightly-github-release:
    name: Nightly GitHub Release
    needs: [nightly, nightly-publish]
    if: always() && needs.nightly.result == 'success' && (needs.nightly.outputs.shouldPublish == 'false' || needs.nightly-publish.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile GitHub nightly pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.nightly.outputs.version }}
        run: |
          tag="v${NIGHTLY_VERSION}"
          title="Crux ${NIGHTLY_VERSION}"
          notes="Automated nightly build from main at ${GITHUB_SHA}. Install from npm with: npm install @use-crux/local@nightly"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prerelease="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)"

            if [ "$prerelease" != "true" ] || [ "$draft" != "false" ] || [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "GitHub release $tag does not match nightly source $GITHUB_SHA." >&2
              exit 1
            fi
          else
            if ! tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null)"; then
              tag_sha=''
            fi
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Git tag $tag does not match nightly source $GITHUB_SHA." >&2
              exit 1
            fi

            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease --latest=false
          fi

      - name: Summary
        env:
          NIGHTLY_VERSION: ${{ needs.nightly.outputs.version }}
        run: |
          echo "GitHub pre-release: v${NIGHTLY_VERSION}." >> "$GITHUB_STEP_SUMMARY"
