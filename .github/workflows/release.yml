name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish a nightly npm release from main.
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * *"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changesets:
    name: Changesets
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      releaseVersion: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: package-version
        run: |
          node -e "process.stdout.write('version=' + require('./packages/local/npm/local/package.json').version + '\n')" \
            >> "$GITHUB_OUTPUT"

  build-embed-assets:
    name: Build Embed Assets
    needs: changesets
    if: github.event_name == 'push' && needs.changesets.outputs.hasChangesets == 'false'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and embed devtools assets
        run: make -C packages/local build-devtools embed

      - name: Upload embed assets
        uses: actions/upload-artifact@v7
        with:
          name: embed-assets
          path: |
            packages/local/internal/assets/embed/**
            packages/local/internal/assets/ui-embed/**
          if-no-files-found: error

  build-local-binary:
    name: Build ${{ matrix.target }}
    needs: [changesets, build-embed-assets]
    if: github.event_name == 'push' && needs.changesets.outputs.hasChangesets == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-unknown-linux-gnu
            apt_packages: ""
          - target: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu
          - target: darwin-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            apt_packages: ""
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            apt_packages: ""
          - target: win32-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-pc-windows-gnu
            apt_packages: gcc-mingw-w64-x86-64
          - target: win32-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-pc-windows-gnullvm
            apt_packages: xz-utils
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download embed assets
        uses: actions/download-artifact@v7
        with:
          name: embed-assets
          path: packages/local/internal/assets

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/local/go.mod
          cache-dependency-path: packages/local/go.sum

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup target add ${{ matrix.rust_target }}
          rustc --version

      - name: Install cross-compilation packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install llvm-mingw for Windows arm64
        if: matrix.target == 'win32-arm64'
        env:
          LLVM_MINGW_VERSION: "20260616"
        run: |
          mkdir -p .tmp/toolchains
          curl -fsSL \
            -o .tmp/toolchains/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar -xJf .tmp/toolchains/llvm-mingw.tar.xz -C .tmp/toolchains
          root="$PWD/.tmp/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Configure Windows arm64 linker
        if: matrix.target == 'win32-arm64'
        run: |
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=$LLVM_MINGW_ROOT/bin/aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR=$LLVM_MINGW_ROOT/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build local binary bundle
        run: make -C packages/local ${{ matrix.target }} VERSION="${{ needs.changesets.outputs.releaseVersion }}"

      - name: Upload local binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: local-${{ matrix.target }}
          path: packages/local/dist/crux-${{ matrix.target }}/bin/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish
    needs: [changesets, build-local-binary]
    if: github.event_name == 'push' && needs.changesets.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, and build editor extension
        run: |
          pnpm --filter crux-vscode test
          pnpm --filter crux-vscode typecheck
          pnpm --filter crux-vscode build

      - name: Download local binary bundles
        uses: actions/download-artifact@v7
        with:
          pattern: local-*
          path: .tmp/local-artifacts

      - name: Restore local binary bundles
        run: |
          mkdir -p packages/local/dist
          for artifact in .tmp/local-artifacts/local-*; do
            target="${artifact##*/local-}"
            mkdir -p "packages/local/dist/crux-${target}/bin"
            cp -R "${artifact}/." "packages/local/dist/crux-${target}/bin/"
          done

      - name: Configure git tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage and validate npm packages
        run: pnpm release:stage && pnpm release:validate

      - name: Decide stable npm publication
        id: npm-state
        run: pnpm release:npm:decide-stable

      - name: Stage and validate GitHub Release assets
        run: |
          pnpm release:assets:stage --version "${{ steps.npm-state.outputs.version }}" --source-commit "$GITHUB_SHA"
          pnpm release:assets:validate --version "${{ steps.npm-state.outputs.version }}" --source-commit "$GITHUB_SHA"

      - name: Publish staged npm packages
        if: steps.npm-state.outputs.action == 'publish'
        run: pnpm release:publish-staged -- --no-skip-existing --git-tag --git-push-tags

      - name: Prepare GitHub release notes
        id: release-notes
        run: pnpm release:notes -- --out .tmp/github-release-notes.md

      - name: Reconcile GitHub Release and immutable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-notes.outputs.tag }}
          RELEASE_TITLE: Crux ${{ steps.release-notes.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release-notes.outputs.notes_file }}
        run: >-
          pnpm release:assets:reconcile --
          --tag "$RELEASE_TAG"
          --title "$RELEASE_TITLE"
          --notes-file "$RELEASE_NOTES"
          --source-commit "$GITHUB_SHA"

  nightly:
    name: Nightly
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.decision.outputs.action }}
      shouldBuild: ${{ steps.decision.outputs.should_build }}
      publishNpm: ${{ steps.decision.outputs.publish_npm }}
      version: ${{ steps.decision.outputs.version }}
      sourceSha: ${{ steps.decision.outputs.source_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Create nightly version
        id: version
        run: node ./scripts/create-nightly-version.mjs

      - name: Decide whether to publish, repair, or stop
        id: decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node ./scripts/decide-nightly-publication.mjs
          --event-name "${{ github.event_name }}"
          --created-version "${{ steps.version.outputs.version }}"
          --source-commit "$GITHUB_SHA"

  nightly-build-embed-assets:
    name: Nightly Build Embed Assets
    needs: nightly
    if: needs.nightly.outputs.shouldBuild == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.nightly.outputs.sourceSha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and embed devtools assets
        run: make -C packages/local build-devtools embed

      - name: Upload embed assets
        uses: actions/upload-artifact@v7
        with:
          name: nightly-embed-assets
          path: |
            packages/local/internal/assets/embed/**
            packages/local/internal/assets/ui-embed/**
          if-no-files-found: error

  nightly-build-local-binary:
    name: Nightly Build ${{ matrix.target }}
    needs: [nightly, nightly-build-embed-assets]
    if: needs.nightly.outputs.shouldBuild == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-unknown-linux-gnu
            apt_packages: ""
          - target: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu
          - target: darwin-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            apt_packages: ""
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            apt_packages: ""
          - target: win32-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: x86_64-pc-windows-gnu
            apt_packages: gcc-mingw-w64-x86-64
          - target: win32-arm64
            runner: blacksmith-4vcpu-ubuntu-2404
            rust_target: aarch64-pc-windows-gnullvm
            apt_packages: xz-utils
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.nightly.outputs.sourceSha }}
          fetch-depth: 0

      - name: Download embed assets
        uses: actions/download-artifact@v7
        with:
          name: nightly-embed-assets
          path: packages/local/internal/assets

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/local/go.mod
          cache-dependency-path: packages/local/go.sum

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup target add ${{ matrix.rust_target }}
          rustc --version

      - name: Install cross-compilation packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install llvm-mingw for Windows arm64
        if: matrix.target == 'win32-arm64'
        env:
          LLVM_MINGW_VERSION: "20260616"
        run: |
          mkdir -p .tmp/toolchains
          curl -fsSL \
            -o .tmp/toolchains/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar -xJf .tmp/toolchains/llvm-mingw.tar.xz -C .tmp/toolchains
          root="$PWD/.tmp/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Configure Windows arm64 linker
        if: matrix.target == 'win32-arm64'
        run: |
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=$LLVM_MINGW_ROOT/bin/aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR=$LLVM_MINGW_ROOT/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build local binary bundle
        run: make -C packages/local ${{ matrix.target }} VERSION="${{ needs.nightly.outputs.version }}"

      - name: Upload local binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: nightly-local-${{ matrix.target }}
          path: packages/local/dist/crux-${{ matrix.target }}/bin/*
          if-no-files-found: error
          compression-level: 0

  nightly-publish:
    name: Nightly Publish or Repair
    needs: [nightly, nightly-build-local-binary]
    if: needs.nightly.outputs.shouldBuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.nightly.outputs.sourceSha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, and build editor extension
        run: |
          pnpm --filter crux-vscode test
          pnpm --filter crux-vscode typecheck
          pnpm --filter crux-vscode build

      - name: Download local binary bundles
        uses: actions/download-artifact@v7
        with:
          pattern: nightly-local-*
          path: .tmp/local-artifacts

      - name: Restore local binary bundles
        run: |
          mkdir -p packages/local/dist
          for artifact in .tmp/local-artifacts/nightly-local-*; do
            target="${artifact##*/nightly-local-}"
            mkdir -p "packages/local/dist/crux-${target}/bin"
            cp -R "${artifact}/." "packages/local/dist/crux-${target}/bin/"
          done

      - name: Stage and validate nightly npm packages
        if: needs.nightly.outputs.publishNpm == 'true'
        env:
          NIGHTLY_VERSION: ${{ needs.nightly.outputs.version }}
        run: pnpm release:stage -- --version "$NIGHTLY_VERSION" && pnpm release:validate

      - name: Stage and validate nightly GitHub Release assets
        env:
          NIGHTLY_VERSION: ${{ needs.nightly.outputs.version }}
          NIGHTLY_SOURCE: ${{ needs.nightly.outputs.sourceSha }}
        run: |
          pnpm release:assets:stage --version "$NIGHTLY_VERSION" --source-commit "$NIGHTLY_SOURCE"
          pnpm release:assets:validate --version "$NIGHTLY_VERSION" --source-commit "$NIGHTLY_SOURCE"

      - name: Publish nightly npm packages
        if: needs.nightly.outputs.publishNpm == 'true'
        run: pnpm release:publish-staged -- --no-skip-existing --npm-tag nightly

      - name: Prepare nightly release notes
        env:
          NIGHTLY_VERSION: ${{ needs.nightly.outputs.version }}
          NIGHTLY_SOURCE: ${{ needs.nightly.outputs.sourceSha }}
        run: >-
          pnpm release:nightly:notes --
          --version "$NIGHTLY_VERSION"
          --source-commit "$NIGHTLY_SOURCE"

      - name: Reconcile GitHub nightly prerelease and immutable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.nightly.outputs.version }}
          NIGHTLY_SOURCE: ${{ needs.nightly.outputs.sourceSha }}
        run: >-
          pnpm release:assets:reconcile --
          --tag "v${NIGHTLY_VERSION}"
          --title "Crux ${NIGHTLY_VERSION}"
          --notes-file .tmp/github-nightly-release-notes.md
          --source-commit "$NIGHTLY_SOURCE"
          --prerelease

      - name: Summary
        run: echo "Nightly ${{ needs.nightly.outputs.action }} completed for ${{ needs.nightly.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
