name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: crux_runtime_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crux_runtime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CRUX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crux_runtime_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and embed local workers
        run: make -C packages/local build-local-workers embed-workers

      - name: Test
        run: pnpm turbo run test --filter='!@use-crux/indexer' --filter='!@use-crux/postgres'

  postgres-storage:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: crux_storage_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crux_storage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CRUX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crux_storage_test
      CRUX_TEST_PGVECTOR_URL: postgres://postgres:postgres@localhost:5432/crux_storage_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and embed local workers
        run: make -C packages/local build-local-workers embed-workers

      - name: PostgreSQL storage release coverage
        run: pnpm --filter @use-crux/postgres test

  indexer:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/local/go.mod
          cache-dependency-path: packages/local/go.sum

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustc --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Static Index contract gate
        run: pnpm test:static-index-contracts

      - name: Go observability conformance
        working-directory: packages/local
        run: go test ./internal/observability/...

  build_package:
    name: build-package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/local/go.mod
          cache-dependency-path: packages/local/go.sum

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustc --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub release asset staging
        run: pnpm release:assets:test

      - name: Build
        run: pnpm build

      - name: Validate npm package staging
        run: pnpm release:stage:ts && pnpm release:validate

  verify:
    if: ${{ always() }}
    needs: [typecheck, test, postgres-storage, indexer, build_package]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require successful verification jobs
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_STORAGE_RESULT: ${{ needs.postgres-storage.result }}
          INDEXER_RESULT: ${{ needs.indexer.result }}
          BUILD_PACKAGE_RESULT: ${{ needs.build_package.result }}
        run: |
          test "$TYPECHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$POSTGRES_STORAGE_RESULT" = success
          test "$INDEXER_RESULT" = success
          test "$BUILD_PACKAGE_RESULT" = success

  typescript-compat:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript 5.5
        run: pnpm typecheck:ts55

      - name: Typecheck TypeScript 6.0
        run: pnpm typecheck:ts60

  indexer-compiler-runtime:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.5.4', '5.9.3', '6.0.3']
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CRUX_INDEXER_SKIP_RUST_OXC_TESTS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Pin indexer TypeScript runtime
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'packages/indexer/package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.dependencies.typescript = process.env.TYPESCRIPT_VERSION
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Show TypeScript runtime
        working-directory: packages/indexer
        run: node -e "import('typescript').then((ts) => console.log(ts.version))"

      - name: Run compiler-sensitive indexer tests
        run: pnpm test:indexer:compiler-runtime

  typescript-preview:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript native preview
        run: pnpm typecheck:tsgo-preview
